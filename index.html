<!DOCTYPE html>
<html lang="te"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>మన సింగంపల్లి - AI పోస్టర్ జెనరేటర్</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1e130b;--card:#2c1d12;--tx:#fff4e6;--mu:#cbb097;--pr:#d9660a;--ac:#f5b82e;--bd:#4d3421}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Telugu',system-ui,sans-serif;max-width:720px;margin:auto;padding-bottom:24px}
header{background:linear-gradient(135deg,#4e2c12,#b94e08 65%,#e8730c);color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:24px}header p{margin:4px 0 0;font-size:13px;opacity:.9}
main{padding:14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:4px 0 12px}input,select,textarea{width:100%;padding:11px;margin:5px 0 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;display:inline-block;text-decoration:none;width:100%;text-align:center}
.mu{color:var(--mu);font-size:13px}
</style></head><body>
<header><h1>మన సింగంపల్లి</h1><p>AI ఆధారిత ప్రొఫెషనల్ పోస్టర్ జనరేటర్</p></header>
<main>
<div class="card">
    <h2>📱 మీ వివరాలు నమోదు చేయండి</h2>
    <form id="aiPosterForm">
        <label class="mu">📷 మీ ఫోటో (అప్‌లోడ్ చేయండి)</label>
        <input id="userPhoto" type="file" accept="image/*" required>
        
        <input id="userName" placeholder="మీ పూర్తి పేరు (ఉదా: VEERABABU)" required>
        <input id="userPhone" type="tel" maxlength="10" placeholder="10 అంకెల మొబైల్ నంబర్" required>
        
        <select id="userProfession" required>
            <option value="">మీ వృత్తి / సేవ ఎంచుకోండి</option>
            <option value="Mechanic">మెకానిక్ (Mechanic)</option>
            <option value="Electrician">ఎలక్ట్రీషియన్ (Electrician)</option>
            <option value="Photographer">ఫోటోగ్రాఫర్ (Photographer)</option>
            <option value="Farmer">రైతు / అగ్రి సేవలు (Farmer)</option>
        </select>

        <select id="userExp">
            <option value="1-3 Years Experience">1-3 Years Experience</option>
            <option value="3-5 Years Experience">3-5 Years Experience</option>
            <option value="5+ Years Experience">5+ Years Experience</option>
        </select>

        <button type="submit" class="btn">✨ AI ద్వారా పోస్టర్ తయారు చేయి</button>
    </form>
</div>

<div id="loadingBox" class="card" style="display:none; text-align:center;">
    <p>⏳ AI పోస్టర్‌ను డిజైన్ చేస్తోంది, దయచేసి వేచి ఉండండి...</p>
</div>

<div id="resultContainer" class="card" style="display:none; text-align:center;">
    <h3 style="color:#22c55e;">మీ పోస్టర్ సిద్ధమైంది!</h3>
    <div id="responseOutput" class="mu" style="margin-top:10px; white-space:pre-wrap;"></div>
</div>
</main>

<script>
// క్లయంట్ ID మరియు API కాన్ఫిగరేషన్
const CLIENT_ID = "gen-lang-client-0884024340";
const API_KEY = "YOUR_GEMINI_API_KEY_HERE"; // ఇక్కడ మీ నిజమైన Gemini API కీని నమోదు చేయండి

document.getElementById('aiPosterForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const name = document.getElementById('userName').value;
    const phone = document.getElementById('userPhone').value;
    const profession = document.getElementById('userProfession').value;
    const exp = document.getElementById('userExp').value;
    const photoFile = document.getElementById('userPhoto').files[0];

    if (!photoFile) {
        alert("దయచేసి మీ ఫోటోను అప్‌లోడ్ చేయండి!");
        return;
    }

    document.getElementById('loadingBox').style.display = 'block';
    document.getElementById('resultContainer').style.display = 'none';

    const reader = new FileReader();
    reader.readAsDataURL(photoFile);
    reader.onload = async function() {
        const base64Image = reader.result.split(',')[1];

        const promptText = `Client ID: ${CLIENT_ID}. Create a highly professional service directory poster for Mana Singampalli. 
        Name: ${name}, Profession: ${profession}, Experience: ${exp}, Phone: ${phone}. 
        Include a professional half-body cutout portrait based on the uploaded photo with a matching profession style and background. 
        The poster must feature a structured grid layout with service category thumbnails, clear English text, village branding logo at top-left, and contact footer.`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [
                        {
                            parts: [
                                { text: promptText },
                                { inline_data: { mime_type: photoFile.type, data: base64Image } }
                            ]
                        }
                    ]
                })
            });

            const data = await response.json();
            document.getElementById('loadingBox').style.display = 'none';
            document.getElementById('resultContainer').style.display = 'block';

            if(data.candidates && data.candidates[0].content.parts[0].text) {
                document.getElementById('responseOutput').innerText = data.candidates[0].content.parts[0].text;
            } else {
                document.getElementById('responseOutput').innerText = "పోస్టర్ జనరేట్ చేయడంలో సమస్య ఏర్పడింది. దయచేసి API కీ తనిఖీ చేయండి.";
            }

        } catch (error) {
            document.getElementById('loadingBox').style.display = 'none';
            console.error("Error:", error);
            alert("కనెక్షన్ లోపం సంభవించింది.");
        }
    };
});
</script>
</body></html>
