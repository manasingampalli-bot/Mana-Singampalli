<!DOCTYPE html>
<html lang="te"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>మన సింగంపల్లి</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1e130b;--card:#2c1d12;--tx:#fff4e6;--mu:#cbb097;--pr:#d9660a;--ac:#f5b82e;--bd:#4d3421;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Telugu',system-ui,sans-serif;max-width:720px;margin:auto;padding-bottom:24px}
header{background:linear-gradient(135deg,#4e2c12,#b94e08 65%,#e8730c);color:#fff;padding:14px 16px;text-align:center}
header h1{margin:0;font-size:24px}header p{margin:4px 0 0;font-size:13px;opacity:.9}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;background:var(--card);border-bottom:1px solid var(--bd);box-shadow:0 2px 6px rgba(0,0,0,.08)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 2px;font:inherit;font-size:12px;cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400}nav button.on{color:var(--pr);font-weight:700}
main{padding:14px}.card{background:var(--card);border:1px solid var(--bd);box-shadow:0 2px 8px rgba(0,0,0,.35);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:4px 0 12px}input,select,textarea{width:100%;padding:11px;margin:5px 0 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;display:inline-block;text-decoration:none}
.btn.s{background:var(--bd);color:var(--tx)}.btn.ig{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.mu{color:var(--mu);font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{background:var(--bd);border-radius:8px;padding:2px 8px;font-size:12px}
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--pr);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.pv{width:96px;height:96px;border-radius:50%;object-fit:cover;display:block;margin:6px 0}
.ai{white-space:pre-wrap;line-height:1.7}
</style></head><body>
<header><h1>మన సింగంపల్లి</h1><p style="margin:8px 0 0;font-size:13px">మన ఊరి వార్తలు • సేవలు • మనుషులు</p></header>
<nav id="nav"></nav>
<main id="m"></main>
<script>
const IG="https://www.instagram.com/mana_singampalli/";
const WA="";
const CATS=[["⚡","ఎలక్ట్రీషియన్"],["🔧","మెకానిక్"],["📸","ఫోటోగ్రాఫర్"],["🌾","రైతు"],["🪚","కార్పెంటర్"],["🧱","మేస్త్రి / బిల్డర్"],["🚰","ప్లంబర్"],["🚜","ట్రాక్టర్ / ట్రాన్స్‌పోర్ట్"],["🧵","టైలర్"],["💇","బార్బర్ / బ్యూటీషియన్"],["🛒","కిరాణా / షాపులు"],["💊","మెడికల్ / ఆరోగ్యం"],["👩‍🏫","టీచర్ / ట్యూషన్"],["🎶","డెకరేషన్ / DJ / ఫంక్షన్"],["🐄","పాడి / పశు సేవలు"],["💻","కంప్యూటర్ / మొబైల్ రిపేర్"],["🍽️","కేటరింగ్ / వంట"],["🧑‍💼","ఇతరులు"]];
const TABS=[["feed","📰","ఫీడ్"],["svc","🛠️","సేవలు"],["ai","🤖","AI"],["reg","📱","నమోదు"]];
let tab="reg",cat="అన్నీ",me=null,members=[];
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
me=JSON.parse(ls.get("ms_me")||"null");

function nav(){$("#nav").innerHTML=TABS.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join("")}
function go(t){tab=t;nav();render()}

function render(){
 const m=$("#m");
 if(tab=="feed"){
  m.innerHTML=`<div class="card"><h2>📸 ఇన్‌స్టాగ్రామ్</h2><p class="mu">మన ఊరి ఫోటోలు, వీడియోలు, తాజా వార్తల కోసం మా అధికారిక పేజీని ఫాలో అవ్వండి.</p><a class="btn ig" href="${IG}" target="_blank" rel="noopener">@mana_singampalli ని చూడండి</a></div>`;
 }else if(tab=="svc"){
  m.innerHTML=`<div class="card mu">సేవల జాబితా ఇక్కడ ప్రదర్శించబడుతుంది.</div>`;
 }else if(tab=="ai"){
  m.innerHTML=`<div class="card"><h2>🤖 AI సహాయకుడు</h2><input id="q" placeholder="మీ ప్రశ్న రాయండి"><button class="btn" onclick="ask()">అడుగు</button><div id="ans" class="ai" style="margin-top:12px"></div></div>`;
 }else{
  m.innerHTML=`<div class="card"><h2>📱 మొబైల్ నంబర్‌తో నమోదు & పోస్టర్ జనరేటర్</h2>
  <form id="registrationForm">
      <label class="mu">📷 మీ ఫోటో (తప్పనిసరి)</label>
      <input id="photoInput" type="file" accept="image/*" required>
      <input id="nameInput" placeholder="మీ పేరు (ఉదా: DVV NAGESH)" required>
      <input id="phoneInput" type="tel" inputmode="numeric" maxlength="10" placeholder="10 అంకెల మొబైల్ నంబర్" required>
      <select id="professionSelect" required>
          <option value="">మీ వృత్తి / సేవ ఎంచుకోండి</option>
          ${CATS.map(c=>`<option value="${c[1]}">${c[1]}</option>`).join("")}
      </select>
      <input id="areaInput" placeholder="మీ వీధి / ప్రాంతం (ఉదా: Singampalli)">
      <select id="expSelect">
          <option value="1-3 Years Experience">1-3 Years Experience</option>
          <option value="3-5 Years Experience">3-5 Years Experience</option>
          <option value="5+ Years Experience">5+ Years Experience</option>
      </select>
      <select id="availSelect">
          <option value="Always Available / Dedicated">Always Available / Dedicated</option>
          <option value="Part Time Available">Part Time Available</option>
      </select>
      <input id="servicesInput" placeholder="మీ సేవలు (ಕಾమాతో వేరు చేయండి, ఉదా: General Service, Engine Repair, Brake Check)">
      <button type="submit" class="btn" style="width:100%; margin-top:10px;">పోస్టర్ తయారు చేయి</button>
  </form></div>

  <div id="posterContainer" style="display:none;" class="card">
      <h3 style="color:#0a5829; text-align:center;">మీ ప్రొఫెషనల్ సర్వీస్ పోస్టర్ సిద్ధమైంది!</h3>
      <canvas id="posterCanvas" width="600" height="900" style="max-width:100%; border:2px solid #0a5829; border-radius:10px; display:block; margin:0 auto; background:#fff;"></canvas>
      <br>
      <div style="text-align:center;">
          <a id="downloadPosterBtn" class="btn" download="singampalli-service-poster.png" style="background:#0a5829; color:#fff; padding:11px 16px; text-decoration:none; border-radius:10px; display:inline-block; font-weight:600;">పోస్టర్ డౌన్‌లోడ్ చేసుకోండి</a>
      </div>
  </div>`;

  setTimeout(() => {
      const regForm = document.getElementById('registrationForm');
      if (regForm) {
          regForm.addEventListener('submit', function(e) {
              e.preventDefault();

              const name = document.getElementById('nameInput').value.toUpperCase();
              const phone = document.getElementById('phoneInput').value;
              const profession = document.getElementById('professionSelect').value || 'Service Specialist';
              const area = document.getElementById('areaInput').value || 'Singampalli, Andhra Pradesh';
              const exp = document.getElementById('expSelect').value;
              const avail = document.getElementById('availSelect').value;
              const rawServices = document.getElementById('servicesInput').value;
              const services = rawServices ? rawServices.split(',').map(s => s.trim()) : ['General Service', 'Expert Repair', 'Quick Support', 'Maintenance', 'Consultation', 'Quality Care'];

              const canvas = document.getElementById('posterCanvas');
              const ctx = canvas.getContext('2d');

              // Background
              ctx.fillStyle = '#f8fafc';
              ctx.fillRect(0, 0, canvas.width, canvas.height);

              // Top White Banner
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, canvas.width, 110);

              // Draw Custom Village Watercolor Hut Emblem (Accurate to image_3.png concept)
              ctx.fillStyle = '#fde047';
              ctx.beginPath();
              ctx.arc(45, 40, 22, 0, Math.PI * 2);
              ctx.fill();
              
              // Hut Roof
              ctx.fillStyle = '#b45309';
              ctx.beginPath();
              ctx.moveTo(25, 48); ctx.lineTo(45, 25); ctx.lineTo(65, 48); ctx.closePath();
              ctx.fill();
              // Hut Base
              ctx.fillStyle = '#78350f';
              ctx.fillRect(35, 48, 20, 15);

              // Top-Left Branding
              ctx.fillStyle = '#0a5829';
              ctx.font = 'bold 20px Arial';
              ctx.textAlign = 'left';
              ctx.fillText('MANA SINGAMPALLI', 80, 38);

              // Sub Banner Tag
              ctx.fillStyle = '#0a5829';
              ctx.beginPath();
              if (ctx.roundRect) ctx.roundRect(80, 48, 215, 24, 12);
              else ctx.rect(80, 48, 215, 24);
              ctx.fill();

              ctx.fillStyle = '#ffffff';
              ctx.font = 'bold 11px Arial';
              ctx.fillText('SINGAMPALLI CAREERS & SERVICES', 88, 64);

              ctx.fillStyle = '#64748b';
              ctx.font = '11px Noto Sans Telugu';
              ctx.fillText('మన సింగంపల్లి - మన ఊరి సేవలు', 80, 92);

              // Dynamic Tagline based on Profession
              ctx.fillStyle = '#0284c7';
              ctx.font = 'italic bold 14px Arial';
              ctx.textAlign = 'right';
              let line1 = "Serving With Excellence,", line2 = "Dedicated To Quality Everyday";
              if(profession.includes('ఫోటోగ్రాఫర్')) { line1 = "Capturing Stories,"; line2 = "Creating Memories Always"; }
              else if(profession.includes('ఎలక్ట్రీషియన్')) { line1 = "Wiring Safety,"; line2 = "Empowering Homes"; }
              else if(profession.includes('మెకానిక్')) { line1 = "Keep On Rolling,"; line2 = "Ride Safely Every Day"; }
              else if(profession.includes('రైతు')) { line1 = "Feeding Lives,"; line2 = "Rooted In Tradition"; }
              ctx.fillText(line1, 580, 40);
              ctx.fillText(line2, 580, 60);

              // Main Header "Meet [Name]"
              ctx.fillStyle = '#0f172a';
              ctx.font = 'bold 22px Arial';
              ctx.textAlign = 'left';
              ctx.fillText('Meet', 20, 140);

              ctx.fillStyle = '#0a5829';
              ctx.font = 'bold 30px Arial';
              ctx.fillText(name, 20, 175);

              ctx.fillStyle = '#0284c7';
              ctx.font = 'bold 18px Arial';
              ctx.fillText(profession, 20, 202);

              ctx.fillStyle = '#334155';
              ctx.font = '14px Arial';
              ctx.fillText('📍 ' + area + ', Andhra Pradesh', 20, 228);

              // 4 Badges Section
              const drawBadge = (x, y, text) => {
                  ctx.fillStyle = '#e0f2fe';
                  ctx.beginPath();
                  if (ctx.roundRect) ctx.roundRect(x, y, 132, 42, 8);
                  else ctx.rect(x, y, 132, 42);
                  ctx.fill();
                  ctx.fillStyle = '#0369a1';
                  ctx.font = 'bold 11px Arial';
                  ctx.textAlign = 'center';
                  ctx.fillText(text, x + 66, y + 26);
              };

              drawBadge(20, 248, exp);
              drawBadge(160, 248, 'Within Village & Surrounds');
              drawBadge(300, 248, 'Telugu & English');
              drawBadge(440, 248, avail);

              // Service Category 1 Banner (Green)
              ctx.fillStyle = '#0a5829';
              ctx.beginPath();
              if (ctx.roundRect) ctx.roundRect(20, 310, 560, 36, 6);
              else ctx.rect(20, 310, 560, 36);
              ctx.fill();

              ctx.fillStyle = '#ffffff';
              ctx.font = 'bold 15px Arial';
              ctx.textAlign = 'left';
              ctx.fillText('🛠️ ' + profession.toUpperCase() + ' PRIMARY SERVICES', 32, 333);

              // Service Grid Cards
              const drawThumb = (x, y, label) => {
                  ctx.fillStyle = '#ffffff';
                  ctx.strokeStyle = '#cbd5e1';
                  ctx.lineWidth = 1;
                  ctx.beginPath();
                  if (ctx.roundRect) ctx.roundRect(x, y, 85, 75, 6);
                  else ctx.rect(x, y, 85, 75);
                  ctx.fill(); ctx.stroke();

                  ctx.fillStyle = '#0f172a';
                  ctx.font = 'bold 11px Arial';
                  ctx.textAlign = 'center';
                  ctx.fillText(label, x + 42.5, y + 42);
              };

              for(let i=0; i<6; i++) {
                  let sLbl = services[i] || ('Service ' + (i+1));
                  let xPos = 20 + (i * 92);
                  drawThumb(xPos, 360, sLbl);
              }

              // Service Category 2 Banner (Blue)
              ctx.fillStyle = '#0284c7';
              ctx.beginPath();
              if (ctx.roundRect) ctx.roundRect(20, 455, 560, 36, 6);
              else ctx.rect(20, 455, 560, 36);
              ctx.fill();

              ctx.fillStyle = '#ffffff';
              ctx.font = 'bold 15px Arial';
              ctx.textAlign = 'left';
              ctx.fillText('⚡ SPECIALIZED & ADVANCED SUPPORT', 32, 478);

              for(let i=0; i<6; i++) {
                  let sLbl = services[i+6] || ('Advanced ' + (i+1));
                  let xPos = 20 + (i * 92);
                  drawThumb(xPos, 505, sLbl);
              }

              // Contact & Social Footer Banner
              ctx.fillStyle = '#0a5829';
              ctx.beginPath();
              if (ctx.roundRect) ctx.roundRect(20, 680, 300, 55, 25);
              else ctx.rect(20, 680, 300, 55);
              ctx.fill();

              ctx.fillStyle = '#ffffff';
              ctx.font = 'bold 13px Arial';
              ctx.textAlign = 'left';
              ctx.fillText('📞 Contact Now', 40, 702);
              ctx.font = 'bold 20px Arial';
              ctx.fillText(phone, 40, 725);

              // Instagram Section
              ctx.fillStyle = '#d946ef';
              ctx.font = 'bold 13px Arial';
              ctx.fillText('📸 Follow Us On Instagram', 345, 702);
              ctx.fillStyle = '#0f172a';
              ctx.font = 'bold 15px Arial';
              ctx.fillText('@mana_singampalli', 345, 725);

              // Trust Guarantees Bar
              ctx.fillStyle = '#064e3b';
              ctx.fillRect(0, 755, 600, 45);
              ctx.fillStyle = '#ffffff';
              ctx.font = 'bold 11px Arial';
              ctx.textAlign = 'center';
              ctx.fillText('✓ Quality Assurance   |   ✓ Community Trust   |   ✓ Dedicated Service   |   ✓ Village Welfare', 300, 782);

              // Base Footer
              ctx.fillStyle = '#0f172a';
              ctx.fillRect(0, 800, 600, 100);
              ctx.fillStyle = '#ffffff';
              ctx.font = 'bold 18px Arial';
              ctx.fillText('SINGAMPALLI', 300, 835);
              ctx.font = '13px Arial';
              ctx.fillStyle = '#94a3b8';
              ctx.fillText('Singampalli, Andhra Pradesh', 300, 858);

              // Render User Photo in Top Right Box
              const photoInput = document.getElementById('photoInput');
              const renderImageOnCanvas = (userImg) => {
                  ctx.save();
                  ctx.beginPath();
                  if (ctx.roundRect) ctx.roundRect(435, 120, 145, 115, 12);
                  else ctx.rect(435, 120, 145, 115);
                  ctx.clip();
                  ctx.drawImage(userImg, 435, 120, 145, 115);
                  ctx.restore();

                  ctx.strokeStyle = '#0a5829';
                  ctx.lineWidth = 3;
                  ctx.beginPath();
                  if (ctx.roundRect) ctx.roundRect(435, 120, 145, 115, 12);
                  else ctx.rect(435, 120, 145, 115);
                  ctx.stroke();

                  const container = document.getElementById('posterContainer');
                  container.style.display = 'block';
                  document.getElementById('downloadPosterBtn').href = canvas.toDataURL('image/png');
                  container.scrollIntoView({ behavior: 'smooth' });
              };

              if (photoInput.files && photoInput.files[0]) {
                  const reader = new FileReader();
                  reader.onload = function(e) {
                      const img = new Image();
                      img.onload = function() { renderImageOnCanvas(img); };
                      img.src = e.target.result;
                  };
                  reader.readAsDataURL(photoInput.files[0]);
              } else {
                  const container = document.getElementById('posterContainer');
                  container.style.display = 'block';
                  document.getElementById('downloadPosterBtn').href = canvas.toDataURL('image/png');
                  container.scrollIntoView({ behavior: 'smooth' });
              }
          });
      }
  }, 100);
 }
}

nav();
render();
</script></body></html>
